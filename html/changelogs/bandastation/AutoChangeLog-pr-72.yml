author: "Paradise SS220 contributors, DS13 contributors, Gregormack and TGMC contributors"
delete-after: True
changes:
  - rscadd: "Зомби заменены некротической чумой Paradise: семь стадий, некроз, укусы, когти, поедание мозга и повторные оживления."
  - rscadd: "Добавлены исследование четырёх лекарств от чумы и необходимые для него реагенты."
  - rscadd: "Магам доступны пять чумных талисманов, поднимающих усиленных зомби со связанными болезнями и прыжком."
  - admin: "«Управление зомби» позволяет заразить, превратить или вылечить персонажа; массовые команды используют новую систему."
  - rscadd: "Обычные зомби могут выбирать шесть мутаций по мере развития эпидемии, с ограничением редких форм и сохранением специализации разума."
  - image: "Для мутаций добавлены оригинальные тела DS13, сохраняющие направления и кадры; лечение возвращает внешность текущего тела."
  - image: "Обычные зомби используют светлые окровавленные тела TGMC, сохраняя одежду и механики Paradise."
  - bugfix: "Учитываются неудачные попытки создать кровоточащую рану, сохраняя защиту от ран и корректную работу когтей."
  - balance: "Ускорен Бегун; дальности его рывка, прыжка Ловчего и плевка Желчника увеличены до 12, 10 и 13 клеток, радиус взрыва Нарывника — до 5."
  - image: "Эволюция зомби сопровождается пульсацией тела и кровавым всплеском в стиле Last Resort; отмена останавливает эффект без изменения тела."
  - image: "Все шесть мутаций используют собственные конечности DS13 в обеих руках и при ударах; Ловчий получил оригинальный взмах, Нарывник бьёт свободной рукой."
  - spellcheck: "Русифицированы цели и подсказки зомби, язык, симптомы, лекарства, чумные болезни и талисманы, меню администратора и связанные медицинские интерфейсы; уточнено описание Гаммы."