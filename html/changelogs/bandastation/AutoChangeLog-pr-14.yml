changes:
  - bugfix: "Напечатанная голова КПБ содержит голосовой модуль для речи и машинных эмоций, в том числе после пересадки человеческого мозга."
  - rscadd: "В робототехнике можно изготовить отдельный голосовой модуль КПБ для уже собранного корпуса."
  - bugfix: "КПБ больше не получают генетические улучшения ДНК-хранилища через старые варианты выбора; превращение человека в КПБ снимает несовместимые мутации хранилища."