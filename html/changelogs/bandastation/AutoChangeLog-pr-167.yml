  - balance: "Танец Злобы срывает простой захват и на время вращения защищает от захвата, перетаскивания, толчков и ударов голыми руками."
  - balance: "Заслон Злобы действует пять секунд."
  - balance: "Медитации со Злобой и паузы между ними занимают вдвое меньше времени."