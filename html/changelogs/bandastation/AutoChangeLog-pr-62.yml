author: "mo0niverse"
delete-after: True
changes:
  - rscadd: "Подам добавлены инерционный полёт, поворот мышью, тяга относительно корпуса и отдельный тормоз."
  - rscadd: "Кнопка ТУРБО удваивает ускорение и предельную скорость пода за удвоенный расход энергии на тягу."
  - balance: "Под получает урон от столкновения в зависимости от скорости и сразу взрывается при полном разрушении корпуса."
  - sound: "Бортовой компьютер пода предупреждает по-русски о батарее, корпусе, кислороде и запасе баллона."
  - image: "При передней тяге у сопла пода появляется прикреплённый огонёк; обновлены значки стрельбы и тормоза."
  - rscdel: "Удалён искристый след джетпака за подом."
  - bugfix: "Посадка, открытие люка ломом и обслуживание пода доступны со всех сторон корпуса."
  - bugfix: "Камера пилота и выстрелы следуют реальному курсу и положению пода."
  - qol: "Инженер челноков получил обычный инженерный доступ, EVA и инженерный скиллчип."