changes:
  - rscadd: "Добавлена профессия тату-мастера для подписчиков T1 и выше. Можно рисовать татуировки, использовать личные трафареты и сводить рисунки с согласия клиента."
  - qol: "Татуировки можно рассмотреть во вкладке осмотра и по желанию сохранить для будущих раундов."
  - sound: "Тату-машинка гудит во время рисования эскиза и процедуры."