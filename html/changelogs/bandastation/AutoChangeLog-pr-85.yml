author: "mo0niverse"
delete-after: True
changes:
  - rscadd: "Разговор из снятой телефонной трубки тихо слышен в радиусе одного тайла, в том числе когда трубка лежит на полу."
  - qol: "ПКМ по трубке позволяет зажать микрофон свободной рукой и продолжать слушать собеседника. Повторный ПКМ освобождает руку."
  - bugfix: "Телефон со снятой трубкой больше не застревает при переносе между этажами: перед переносом нужно положить трубку на аппарат."