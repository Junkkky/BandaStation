author: "mo0niverse"
delete-after: True
changes:
  - rscadd: "Куратор может оформлять иллюстрированные книги, сохранять их в межраундовый архив и печатать тираж."
  - qol: "У книг появились развороты, цветные обложки, кнопки оформления страниц и личные закладки."
  - sound: "Держа книгу в руке, можно прочесть страницу окружающим голосом персонажа через TTS220."
  - server: "Для архива книг нужна миграция БД до 5.35. Для импорта иллюстраций по ссылке нужны Python 3 с Pillow и режим Trusted у DreamDaemon."