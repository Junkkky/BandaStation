  - balance: "Codex Cicatrix и Codex Morbus снова быстрее поглощают влияния и рисуют руны; Cicatrix остаётся знанием первого уровня."
  - qol: "Кодексы снова можно свободно открывать и закрывать. Раскрытый кодекс в руках служит фокусировкой."