changes:
  - balance: "«Последняя ярость» хранит заряд до первого успешного удара. При потере меча заряд пропадает."
  - balance: "«Заслон Злобы» защищает 6 секунд вместо пяти."
  - sound: "При призыве Злобы с пола слышно полное раскрытие клинка. Звуки «Зова Злобы» стали тише, а зарядка и критический удар «Последней ярости» — громче."