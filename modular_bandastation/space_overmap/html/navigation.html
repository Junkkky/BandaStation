<main class="flight">
  <header><strong>НАВИГАЦИЯ</strong><span id="mode">ОЖИДАНИЕ</span></header>
  <section class="body">
    <section class="plot"><div class="plot-head">СЕВЕР ↑ <label>Масштаб <select id="zoom"><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><canvas id="chart" width="620" height="540" tabindex="0" aria-label="Карта контактов. Нажмите на маркер, чтобы выбрать цель."></canvas><div class="legend"><span class="own">▲ Судно</span><span class="target">◇ Цель</span><span class="vector">↗ Вектор скорости</span></div><p id="contact" class="help" role="status" hidden></p></section>
    <aside class="telemetry"><h2 id="target" role="status">ЦЕЛЬ НЕ ВЫБРАНА</h2><button id="scan">СКАНИРОВАНИЕ</button><p id="encounter" role="status"></p><dl><dt>Координаты</dt><dd id="position"></dd><dt>Скорость, м/с</dt><dd id="speed"></dd><dt>Вектор X / Y</dt><dd id="velocity"></dd><dt>Курс / заданный</dt><dd id="heading"></dd><dt>Дистанция / время</dt><dd id="distance"></dd><dt>Сближение, м/с</dt><dd id="closing"></dd><dt>Тяга</dt><dd id="engines"></dd></dl>
    <div class="course-control"><label for="course">Курс, °</label><input id="course" type="number" min="0" max="359" value="90"><button id="set-course" aria-label="Задать курс">↵</button></div>
    <div class="maneuver-controls" role="group" aria-label="Управление кораблём"><button id="turn-left" title="Поворот влево на 15°" aria-label="Поворот влево">↶</button><button id="throttle-more" title="Увеличить тягу" aria-label="Увеличить тягу">↑</button><button id="turn-right" title="Поворот вправо на 15°" aria-label="Поворот вправо">↷</button><button id="strafe-left" title="Стрейф влево: удерживать" aria-label="Стрейф влево">←</button><button id="throttle-less" title="Уменьшить тягу" aria-label="Уменьшить тягу">↓</button><button id="strafe-right" title="Стрейф вправо: удерживать" aria-label="Стрейф вправо">→</button></div>
    <div class="thrust-controls"><div><h2>ТЯГА</h2><div class="helm-throttle"><div class="throttle-scale" aria-hidden="true"><span>100</span><span>75</span><span>50</span><span>25</span><span>0</span></div><input id="throttle" type="range" min="0" max="100" step="5" value="100" aria-label="Рычаг тяги, проценты"><output id="throttle-value" for="throttle">100%</output></div></div>
    <div class="thrust-buttons"><button id="depart">ОТХОД</button><button id="autopilot">АВТОПИЛОТ</button><button id="dock">СТЫКОВКА</button><button id="stop" class="stop">ТОРМОЖЕНИЕ</button><p id="braking-distance"></p></div></div></aside>
  </section>
  <p id="planet" class="help" role="status" hidden></p>
  <footer id="status" role="status"></footer>
</main>
<script>window.initSpaceNavigation('@CONSOLE@', @STATE@);</script>
